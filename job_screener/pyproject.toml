[project]
name = "job-screener"
version = "0.1.0"
description = "doda求人一覧HTMLを読み、希望条件でA/B/C/D/?にトリアージしてExcel出力するツール (MVP)"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
job-screener = "job_screener.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

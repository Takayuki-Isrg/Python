# ============================================================
# 求人選別の評価条件
# ここを書き換えるだけでスコアが変わる。コードは触らない。
# 金額は「万円」単位で書く（内部で円に変換）。
# ============================================================

must:
  # 最低年収ライン。提示レンジの「上限」がこの額未満なら除外D。
  # レンジがこの額をまたぐ場合（下限<450<=上限）は除外せず懸念付きで残す。
  salary_min_man: 450

# 満たしたら即 D（除外）。SES/客先常駐。
# 「常駐無」「客先常駐なし」などの否定表現は打ち消す（negation_window 参照）。
exclude:
  - label: "SES/客先常駐"
    keywords: ["SES", "客先常駐", "特定派遣", "受託常駐", "常駐"]

# 加点キーワード（weight はプラス）。あなたの最優先3つを高ウェイトに。
plus:
  - {label: "AI活用",     weight: 40, keywords: ["AI活用", "AI", "機械学習", "生成AI", "LLM", "データ活用"]}
  - {label: "業務効率化", weight: 35, keywords: ["業務効率化", "効率化", "RPA", "自動化"]}
  - {label: "DX推進",     weight: 35, keywords: ["DX", "デジタル変革", "デジタルトランスフォーメーション"]}
  # --- ここから下は副次加点（初期値。実運用で調整してください）---
  - {label: "社内SE",     weight: 25, keywords: ["社内SE", "情シス", "情報システム部"]}
  - {label: "自社開発",   weight: 20, keywords: ["自社サービス", "自社開発", "自社製品", "自社システム"]}
  - {label: "リモート可", weight: 15, keywords: ["フルリモート", "リモート", "在宅", "テレワーク"]}
  - {label: "上流工程",   weight: 10, keywords: ["上流工程", "要件定義", "企画"]}

# 減点キーワード（weight はマイナス値で書く）。初期値・調整前提。
minus:
  - {label: "金融系",     weight: -10, keywords: ["金融特化", "証券", "銀行"]}
  - {label: "官公庁系",   weight: -10, keywords: ["官公庁", "公共案件"]}
  - {label: "PM必須",     weight: -15, keywords: ["PM経験必須", "PM必須", "マネジメント必須", "管理職"]}
  - {label: "未経験層向け", weight: -10, keywords: ["未経験歓迎", "未経験可", "第二新卒"]}

# スコア → ランクの境界（この値以上で該当ランク）。これ未満は D。
thresholds:
  A: 60
  B: 30
  C: 0

# 加点・減点キーワードの直後この文字数以内に打ち消し語があれば、その一致を無効化。
# 例:「1人常駐無」→ 常駐 を SES と誤判定しない。
negation_window: 4
negation_words: ["無", "なし", "不要", "ゼロ", "無し"]

# 詳細ページを見ないと分からない項目。全求人に「要確認」として付与し、Stage2 の指針にする。
always_unknown:
  - "勤務地（詳細）"
  - "必須/歓迎条件"
  - "開発/運用/企画の業務比率"
